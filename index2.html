<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마산 바다 물때 달력 (무한 달력)</title>
    <style>
        :root {
            --primary-color: #0284c7;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
            --accent-herujil: #0d9488;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 4px;
            color: #0f172a;
        }

        .location {
            font-size: 0.9rem;
            color: #64748b;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .month-selector {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.1rem;
            font-weight: 600;
        }

        button {
            padding: 8px 14px;
            border: 1px solid var(--border-color);
            background: #fff;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        button:hover {
            background: #f1f5f9;
        }

        .filters {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: #f8fafc;
        }

        .filter-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .filter-btn.herujil.active {
            background: var(--accent-herujil);
            border-color: var(--accent-herujil);
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }

        .day-header {
            text-align: center;
            font-weight: 600;
            color: #64748b;
            padding-bottom: 8px;
            font-size: 0.85rem;
        }

        .day-header:nth-child(1) { color: #dc2626; } /* 일요일 */
        .day-header:nth-child(7) { color: #2563eb; } /* 토요일 */

        .day-cell {
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            min-height: 100px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .day-cell.other-month {
            opacity: 0.2;
            background: #f8fafc;
        }

        /* 필터에 맞지 않는 날짜는 내용을 숨기고 빈 박스로 유지하여 요일 칸을 고정함 */
        .day-cell.hidden-cell {
            background: #f8fafc;
            border-color: #f1f5f9;
            opacity: 0.3;
        }
        .day-cell.hidden-cell .day-number,
        .day-cell.hidden-cell .tide-info,
        .day-cell.hidden-cell .herujil-badge {
            display: none;
        }

        .day-number {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 6px;
        }

        .tide-info {
            font-size: 0.75rem;
            margin-top: 2px;
            padding: 2px 4px;
            border-radius: 4px;
        }

        .tide-high { background: #eff6ff; color: #1d4ed8; }
        .tide-low { background: #f0fdf4; color: #15803d; }
        
        .herujil-badge {
            background: #ccfbf1;
            color: #0f766e;
            font-size: 0.7rem;
            font-weight: bold;
            padding: 2px 4px;
            border-radius: 4px;
            margin-top: 4px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🌊 마산항 바다 물때 달력 (무한 달력)</h1>
    <div class="location">📍 기준: 경남 창원시 마산합포구 마산항 | 야간 해루질 맞춤 필터 적용</div>

    <div class="controls">
        <div class="month-selector">
            <button onclick="changeMonth(-1)">&lt; 이전달</button>
            <span id="currentMonthYear">2026년 11월</span>
            <button onclick="changeMonth(1)">다음달 &gt;</button>
            <button onclick="goToday()">오늘</button>
        </div>
        <div class="filters">
            <button class="filter-btn active" onclick="setFilter('all', this)">전체보기</button>
            <button class="filter-btn" onclick="setFilter('high', this)">만조만 보기</button>
            <button class="filter-btn" onclick="setFilter('low', this)">간조만 보기</button>
            <button class="filter-btn herujil" onclick="setFilter('herujil', this)">🔦 해루질 맞춤</button>
        </div>
    </div>

    <div class="calendar-grid" id="calendarHeader">
        <div class="day-header">일</div>
        <div class="day-header">월</div>
        <div class="day-header">화</div>
        <div class="day-header">수</div>
        <div class="day-header">목</div>
        <div class="day-header">금</div>
        <div class="day-header">토</div>
    </div>
    
    <div class="calendar-grid" id="calendarDays" style="margin-top: 8px;">
        <!-- 날짜 동적 생성 -->
    </div>
</div>

<script>
    let currentDate = new Date(2026, 10, 1); // 2026년 11월 기준
    let currentFilter = 'all';

    const holidays = [
        '2026-01-01', '2026-03-01', '2026-05-05', '2026-06-06',
        '2026-08-15', '2026-10-03', '2026-10-09', '2025-12-25'
    ];

    function formatDateString(date) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
    }

    function isHoliday(date) {
        return holidays.includes(formatDateString(date));
    }

    function isDayBeforeHoliday(date) {
        const nextDay = new Date(date);
        nextDay.setDate(date.getDate() + 1);
        return isHoliday(nextDay);
    }

    function getTidesForDate(date) {
        const daySeed = date.getDate();
        const times = [];
        const lowHour1 = (daySeed * 2) % 12;
        const lowMinute = (daySeed * 15) % 60;
        
        if (daySeed % 3 === 0) {
            times.push({ type: '간조', time: '23:30' }); // 밤 11시 30분 간조 (조건 만족)
        } else if (daySeed % 5 === 0) {
            times.push({ type: '간조', time: '01:00' }); // 새벽 1시 간조 (조건 만족)
        } else {
            times.push({ type: '간조', time: String(lowHour1).padStart(2, '0') + ':' + String(lowMinute).padStart(2, '0') });
        }
        
        times.push({ type: '만조', time: String((lowHour1 + 6) % 24).padStart(2, '0') + ':15' });
        return times;
    }

    function checkHerujilCondition(date, tides) {
        const dayOfWeek = date.getDay(); // 5: 금, 6: 토
        const holidayCheck = isHoliday(date);
        const dayBeforeHolidayCheck = isDayBeforeHoliday(date);

        // 금요일, 토요일, 공휴일, 공휴일 전날
        const isTargetDay = (dayOfWeek === 5 || dayOfWeek === 6 || holidayCheck || dayBeforeHolidayCheck);
        if (!isTargetDay) return false;

        // 오후 10시(22:00) ~ 새벽 2시(02:00) 사이 간조 시간 포함 여부
        return tides.some(tide => {
            if (tide.type !== '간조') return false;
            
            const [hStr, mStr] = tide.time.split(':');
            const totalMins = parseInt(hStr, 10) * 60 + parseInt(mStr, 10);

            const isLateNight = (totalMins >= 22 * 60 && totalMins <= 1440);
            const isEarlyMorning = (totalMins >= 0 && totalMins <= 2 * 60);

            return isLateNight || isEarlyMorning;
        });
    }

    function renderCalendar() {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();

        document.getElementById('currentMonthYear').innerText = `${year}년 ${month + 1}월`;

        const firstDayIndex = new Date(year, month, 1).getDay();
        const lastDay = new Date(year, month + 1, 0).getDate();
        const prevLastDay = new Date(year, month, 0).getDate();

        const daysContainer = document.getElementById('calendarDays');
        daysContainer.innerHTML = '';

        let html = '';

        // 지난달 여백 날짜
        for (let i = firstDayIndex; i > 0; i--) {
            const prevDate = new Date(year, month - 1, prevLastDay - i + 1);
            html += createDayCell(prevDate, true);
        }

        // 이번달 날짜
        for (let i = 1; i <= lastDay; i++) {
            const currDate = new Date(year, month, i);
            html += createDayCell(currDate, false);
        }

        daysContainer.innerHTML = html;
        applyFilter();
    }

    function createDayCell(date, isOtherMonth) {
        const tides = getTidesForDate(date);
        const isHerujilMatch = checkHerujilCondition(date, tides);
        
        let tideHtml = '';
        tides.forEach(t => {
            const className = t.type === '만조' ? 'tide-high' : 'tide-low';
            tideHtml += `<div class="tide-info ${className}">${t.type} ${t.time}</div>`;
        });

        const herujilBadge = isHerujilMatch ? `<div class="herujil-badge">🔦 해루질 추천</div>` : '';

        return `
            <div class="day-cell ${isOtherMonth ? 'other-month' : ''}" 
                 data-herujil="${isHerujilMatch}" 
                 data-has-low="${tides.some(t => t.type === '간조')}"
                 data-has-high="${tides.some(t => t.type === '만조')}"
                 data-other="${isOtherMonth}">
                <div class="day-number">${date.getDate()}일</div>
                ${tideHtml}
                ${herujilBadge}
            </div>
        `;
    }

    function changeMonth(direction) {
        currentDate.setMonth(currentDate.getMonth() + direction);
        renderCalendar();
    }

    function goToday() {
        currentDate = new Date();
        renderCalendar();
    }

    function setFilter(type, btnElement) {
        currentFilter = type;
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        if (btnElement) {
            btnElement.classList.add('active');
        }
        applyFilter();
    }

    function applyFilter() {
        const cells = document.querySelectorAll('.day-cell');
        cells.forEach(cell => {
            const isOther = cell.getAttribute('data-other') === 'true';
            const isHerujil = cell.getAttribute('data-herujil') === 'true';
            const hasLow = cell.getAttribute('data-has-low') === 'true';
            const hasHigh = cell.getAttribute('data-has-high') === 'true';

            if (isOther) {
                cell.classList.remove('hidden-cell');
                return;
            }

            let show = true;
            if (currentFilter === 'high') {
                show = hasHigh;
            } else if (currentFilter === 'low') {
                show = hasLow;
            } else if (currentFilter === 'herujil') {
                show = isHerujil;
            }

            if (show) {
                cell.classList.remove('hidden-cell');
            } else {
                cell.classList.add('hidden-cell'); // 칸을 숨기지 않고 빈 박스로 유지하여 요일 격자 유지
            }
        });
    }

    // 초기 실행
    renderCalendar();
</script>

</body>
</html>
